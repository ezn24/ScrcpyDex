name: Build v1.1 physical keyboard fix

on:
  push:
    branches: [fix/v1.1-uhid-keyboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows client
        shell: pwsh
        run: |
          dotnet publish client/ScrcpyDex.WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RestoreSources=https://api.nuget.org/v3/index.json -o publish/keyboard-fix --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package runtime files
        shell: pwsh
        run: |
          $package = 'publish/keyboard-fix'
          Copy-Item server/scrcpydex-server.jar $package
          Copy-Item LICENSE $package
          Copy-Item PROJECT.md "$package/KEYBOARD-FIX.md"
          Copy-Item docs/THIRD_PARTY_NOTICES.md $package
          Get-ChildItem $package -Filter *.pdb | Remove-Item
          $hash = (Get-FileHash "$package/ScrcpyDeX.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScrcpyDeX.exe" | Set-Content "$package/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyDeX-v1.1-physical-keyboard-win-x64
          path: publish/keyboard-fix/
          if-no-files-found: error
          retention-days: 14
