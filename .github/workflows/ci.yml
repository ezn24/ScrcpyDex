name: CI & Release Pipeline

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feat/**'
      - 'fix/v1.1-uhid-keyboard'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    name: Build and Package Windows (v1.1 UI)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build original Windows client
        shell: pwsh
        run: |
          dotnet publish client/ScrcpyDex.WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/package --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble release package
        shell: pwsh
        run: |
          $package = 'publish/package'
          New-Item -ItemType Directory -Force "$package/server" | Out-Null
          Copy-Item server/scrcpydex-server.jar "$package/server/"
          Copy-Item assets "$package/assets" -Recurse
          Copy-Item config "$package/config" -Recurse
          Copy-Item LICENSE, PROJECT.md, stop-dex.bat $package
          Copy-Item docs/THIRD_PARTY_NOTICES.md, docs/DISCLAIMER.md $package
          Get-ChildItem $package -Filter *.pdb | Remove-Item
          Compress-Archive -Path "$package/*" -DestinationPath publish/ScrcpyDeX-v1.1.1-win-x64.zip
          $hash = (Get-FileHash publish/ScrcpyDeX-v1.1.1-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScrcpyDeX-v1.1.1-win-x64.zip" | Set-Content publish/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            publish/*.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package-windows
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/v1.1-uhid-keyboard'
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          target_commitish: ${{ github.sha }}
          name: v1.1.1 - Physical keyboard fix
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Based on v1.1 with its original Windows interface.
            Both launch paths now pass --keyboard=uhid so Android can register a physical keyboard.

            Download and extract ScrcpyDeX-v1.1.1-win-x64.zip, then run ScrcpyDeX.exe.
            Official scrcpy 2.4 or newer and ADB must be installed separately.
            Phone-side keyboard recognition still requires hardware verification.
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
      - name: Remove temporary build branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              {name: 'feat/windows-keyboard-build', sha: '64b9ae1d99ff99bc5f9b7eca02d4768fb9635da7'},
              {name: 'fix/v1.1-uhid-keyboard', sha: context.sha}
            ];
            for (const branch of branches) {
              try {
                const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/' + branch.name});
                if (data.object.sha !== branch.sha) {
                  core.warning('Keeping branch because its head changed: ' + branch.name);
                  continue;
                }
                await github.rest.git.deleteRef({...context.repo, ref: 'heads/' + branch.name});
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
