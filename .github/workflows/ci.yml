name: CI & Release Pipeline

on:
  push:
    branches: ['fix/v1.1-uhid-keyboard']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    name: Build and verify single Windows EXE
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish original v1.1 interface with embedded server
        shell: pwsh
        run: |
          dotnet run --project tests/HdmiSession.Tests/HdmiSession.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish client/ScrcpyDex.WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.1.3 -p:AssemblyVersion=1.1.3.0 -p:FileVersion=1.1.3.0 -o publish/single-exe --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify EXE without companion files
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP ('scrcpydex-bundle-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $isolated | Out-Null
          Copy-Item publish/single-exe/ScrcpyDeX.exe $isolated
          $probe = Start-Process -FilePath "$isolated/ScrcpyDeX.exe" -ArgumentList '--verify-bundle' -WorkingDirectory $isolated -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'Embedded server or UHID keyboard verification failed.' }
          $hash = (Get-FileHash publish/single-exe/ScrcpyDeX.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScrcpyDeX.exe" | Set-Content publish/single-exe/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            publish/single-exe/ScrcpyDeX.exe
            publish/single-exe/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          target_commitish: ${{ github.sha }}
          name: v1.1.3 - HDMI activation for third-party input methods
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Uses the original upstream v1.1 release interface and its embedded server implementation.
            Defaults to simulated HDMI activation, matching the display activation method used by DX-Manager, while retaining UHID physical keyboard input.

            Download ScrcpyDeX.exe directly. No companion JAR or ZIP extraction is needed.
            Official scrcpy and ADB must still be installed, as with upstream.
            The build tests display selection, ownership, rollback, cancellation, and cleanup, then verifies the isolated EXE and embedded server.
            Gboard/SwiftKey compatibility depends on the phone firmware and still needs physical device verification.
            Stop DX-Manager or other simulated-display owners before starting this version.
            The previous activation method remains available via device.activationMode=wireless in the settings file.
          files: |
            release-assets/ScrcpyDeX.exe
            release-assets/SHA256SUMS.txt
